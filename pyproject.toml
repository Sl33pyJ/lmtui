# ------ Build backend ------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ------ Project metadata ------
[project]
name = "lmtui"
version = "0.1.0"
description = "A lossless Apple Music TUI for macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
]

# ------ Dev extras ------
[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

# ------ CLI entry point ------
[project.scripts]
lmtui = "lmtui.__main__:main"

# ------ Package discovery ------
[tool.hatch.build.targets.wheel]
packages = ["src/lmtui"]
